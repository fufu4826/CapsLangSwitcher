name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        shell: pwsh
        run: .\BuildExe.ps1

      - name: Build release package
        shell: pwsh
        run: .\BuildRelease.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsLangSwitcher
          path: release/CapsLangSwitcher.zip
